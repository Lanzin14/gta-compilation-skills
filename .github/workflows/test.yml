name: Testes das skills

on:
  pull_request:
  push:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Instalar ffmpeg e fontes
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
          ffmpeg -version | head -1

      - name: Teste ponta a ponta (vídeos sintéticos)
        run: python3 tests/e2e_test.py
